[project]
name = "geo-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "andrewpoile", email = "andrewpoile@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "geopandas>=1.1.3",
    "numba>=0.65.1",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pymoo>=0.6.2",
    "python-calamine>=0.8.2",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
]

[project.scripts]
geo-model = "geo_model.scripts.sweep:main"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # experiments.ipynb, a local notebook.
    "ipykernel>=7.3.0",
    "pointpats>=2.5.5",
    # tests/data/test_areas.py writes its population workbooks with it.
    "openpyxl>=3.1.5",
    "pyrefly>=1.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
    "scipy-stubs>=1.18.1.0",
    "types-geopandas>=1.1.4.20260807",
    "types-seaborn>=0.13.2.20260728",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test files mirror the package, so a basename can repeat across folders.
addopts = ["--import-mode=importlib"]
# tests/shared/frames.py, the synthetic frames tests in several folders share,
# which importlib mode leaves them unable to import from one another. Its
# folder alone, so the mirrored test folders are not importable as packages.
pythonpath = ["tests/shared"]

[tool.coverage.run]
source = ["geo_model"]
core = "sysmon"

[tool.pyrefly]
search-path = ["src", "tests/shared"]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
