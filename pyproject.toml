[project]
name = "geo-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "andrewpoile", email = "andrewpoile@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "geopandas>=1.1.3",
    "ipykernel>=7.3.0",
    "numba>=0.65.1",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pointpats>=2.5.5",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
]

[project.scripts]
geo-model = "geo_model:main"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"
